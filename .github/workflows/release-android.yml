name: Android - Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      publish_play:
        description: 'Publish the AAB to Google Play (uncheck to only build the AAB/APK artifacts)'
        required: true
        default: true
        type: boolean

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Mobile target = high-res assets from src/mobileAssets/ (matches README / deploy:android).
      - name: Build web (mobile target)
        run: npm run build:mobile

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      # Regenerates capacitor.build.gradle / capacitor.settings.gradle / plugin module
      # and copies dist/ into android/app/src/main/assets/public.
      - name: Sync Capacitor
        run: npx cap sync android

      # versionName: from the git tag (v1.2.3 -> 1.2.3), else package.json version.
      # versionCode: the monotonic GitHub run number (Play requires it to always increase).
      - name: Compute version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME=$(node -p "require('./package.json').version")
          fi
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building versionName=${VERSION_NAME} versionCode=${GITHUB_RUN_NUMBER}"

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      # bundleRelease  -> AAB (Google Play)
      # assembleRelease -> universal APK (sideload to test device + other Android stores)
      # Both are signed with the same upload keystore via AGP injected-signing properties.
      - name: Build release AAB + universal APK
        working-directory: android
        run: |
          ./gradlew bundleRelease assembleRelease \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PversionName=${{ steps.ver.outputs.name }} \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Upload AAB artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: SumQuest-${{ steps.ver.outputs.name }}-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload universal APK artifact (testing / other stores)
        uses: actions/upload-artifact@v4
        with:
          name: SumQuest-${{ steps.ver.outputs.name }}-universal-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # Publishes on tag pushes, or on manual runs when "publish_play" is checked.
      - name: Publish to Google Play
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_play == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.ANDROID_PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
