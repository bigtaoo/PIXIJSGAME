name: client-deploy

# Auto-publish the SumQuest web client (Worker sumquest-client) to Cloudflare, served at
# c.gamestao.com + sumquest.gamestao.com.
# Trigger: push to main touching the game source or this workflow/config, or manual Run from
# the Actions page.
# Flow: npm ci → npm run build:web → stage → npm run build:mobile → stage under /mobile/latest/
#       → wrangler deploy.
# Mirrors funny/.github/workflows/client-deploy.yml — see funny's
# design/product/deploy-cloudflare.md §6 for the account/pattern this reuses.
#
# One deliberate divergence from funny's version: that one triggers on `workflow_run` after a
# workflow named "CI", because funny's e2e suite takes ~25 minutes and a plain push trigger
# would race a still-red CI and could ship a broken commit. This repo has no workflow named
# "CI" (only lint.yml and vitest), so `workflow_run` would never fire here. Push + path filter
# is the other house variant, same as daydayup's animator-deploy.yml.
#
# This is now the only web deploy. deploy.yml published the same build to GitHub Pages at
# gamestao.com; the two ran side by side until c.gamestao.com was verified playable, then the
# apex went to the studio site (bigtaoo/goodgoodstudy) and Pages had no domain left to serve.
# The last Pages build is still reachable at bigtaoo.github.io/PIXIJSGAME/ if a fallback is
# ever wanted, and restoring the pipeline is a git revert.
#
# Reuses the gamestao.com Cloudflare account (same secrets as every other repo's deploy):
#   CLOUDFLARE_API_TOKEN   — repo secret. An "Edit Cloudflare Workers" token; the same value
#                            covers every Worker on the account, so the token made for
#                            bigtaoo/goodgoodstudy works here unchanged — no new token needed.
#   CLOUDFLARE_ACCOUNT_ID  — repo secret, e64b61f1629ebcc49ee9b6eea2a95b82
# NOTE: as of 2026-09-03 this repo has NEITHER of those. It holds only the nine Apple/ASC
# secrets used by release-ios.yml, so both have to be added before this can run.
# Enable switch: repo variable CLIENT_DEPLOY_ENABLED = true (job skipped if not set, to avoid
# red builds before setup is complete).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'audio/**'
      - 'public/**'
      - 'webpack.config.js'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/generate-manifest.js'
      - 'wrangler/client.jsonc'
      - '.github/workflows/client-deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

# Only one client deployment runs at a time; a new run cancels the old one to prevent
# concurrent deploy conflicts.
concurrency:
  group: client-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip the entire job if repo variable CLIENT_DEPLOY_ENABLED is not 'true'.
    if: ${{ vars.CLIENT_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      # Node 22. It used to be 20 here with a second setup-node before the deploy step,
      # because wrangler 4.x refuses to start below 22 while the build wanted parity with the
      # GitHub Pages pipeline that produced the live artifact. Pages is retired, so there is
      # nothing left to keep parity with and one version does for both.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci rather than the Pages workflow's npm install: the lockfile is in sync (verified
      # 2026-09-03), and a deploy should install exactly what is locked.
      - run: npm ci

      # Outputs dist/.
      - name: build web bundle
        run: npm run build:web

      # dist/ is about to be overwritten by the mobile build, so move it aside first. Same
      # two-stage shuffle the Pages workflow does with pages-root.
      - name: stage web output
        run: mv dist cf-root

      # The hot-update payload shipped iOS/Android builds fetch. Same env the Pages workflow
      # passes, so generate-manifest.js produces the same manifest.
      - name: build mobile hot-update payload
        run: npm run build:mobile
        env:
          BUILD_ID: ${{ github.sha }}
          NATIVE_BUILD_NUMBER: 1

      - name: stage mobile output under /mobile/latest/
        run: |
          mkdir -p cf-root/mobile/latest
          cp -r dist/. cf-root/mobile/latest/

      # Shipped apps fetch this payload from the Capacitor WebView (capacitor://localhost on
      # iOS, https://localhost on Android) with plain fetch, so it is a cross-origin request.
      # GitHub Pages sent Access-Control-Allow-Origin: * on everything and the client never had
      # to think about it; Workers static assets sends no CORS headers at all, so moving the
      # host without this file would fail every update with a CORS error rather than a status
      # code. Only /mobile/latest/* — the game itself is same-origin and needs nothing.
      #
      # cf-root is a staging tree built here and not committed, so the file is written here
      # rather than living in the repo.
      - name: allow cross-origin hot-update fetches
        run: |
          cat > cf-root/_headers <<'HEADERS'
          /mobile/latest/*
            Access-Control-Allow-Origin: *
          HEADERS
          cat cf-root/_headers

      # Run from repo root using -c to specify the client config (assets point to ./cf-root, no
      # Worker script). Uses npx wrangler directly (not wrangler-action) so errors are visible
      # as-is, pinned so a wrangler release cannot change what a deploy does without a commit.
      - name: deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.128.0 deploy -c wrangler/client.jsonc

      # A successful upload is not a served page. Both custom domains and the hot-update
      # manifest, so a broken deploy cannot look green.
      #
      # Two things the first version of this got wrong, both worth keeping in mind:
      #
      #   - GitHub runs `run:` blocks with `bash -e`. A failing curl therefore killed the whole
      #     step at the assignment, before it could print anything or retry -- which is exactly
      #     what happened while the custom domains were still provisioning (curl exit 6, host
      #     not yet resolvable). `|| true` keeps curl's exit code away from errexit.
      #   - `--retry` does not help with that either, and 5 retries was nowhere near enough:
      #     a brand-new custom domain took minutes to get DNS plus an edge certificate.
      #
      # Hence a deadline shared across all three URLs, so the total wait is bounded no matter
      # how many hosts are checked.
      - name: verify the deployed hosts
        run: |
          deadline=$(( $(date +%s) + 360 ))
          fail=0
          for url in https://c.gamestao.com/ https://sumquest.gamestao.com/ https://c.gamestao.com/mobile/latest/manifest.json; do
            code=000
            while :; do
              # `|| true`, not `|| echo 000`: on a resolution failure curl already prints
              # 000 itself, so echoing another one produced "000000" in the log.
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
              code=${code:-000}
              [ "$code" = 200 ] && break
              [ "$(date +%s)" -ge "$deadline" ] && break
              echo "  waiting: $code  $url"
              sleep 10
            done
            echo "$code  $url"
            [ "$code" = 200 ] || fail=1
          done
          if [ "$fail" != 0 ]; then
            echo "::error::a deployed host did not answer 200 within 6 minutes. On the FIRST"
            echo "deploy of a new custom domain this can still be DNS or the edge certificate"
            echo "provisioning -- check the Worker's domains in the Cloudflare dashboard, and"
            echo "curl with --resolve to rule out a stale negative DNS cache, before assuming"
            echo "the deploy itself failed."
            exit 1
          fi

      # A 200 on the manifest is not enough: without this header the WebView rejects the
      # response before the client ever sees it, and the failure looks like a silent no-op in
      # the app while CI stays green. Checked separately so the error message can say so.
      - name: verify the hot-update manifest is fetchable cross-origin
        run: |
          headers=$(curl -sI --max-time 10 https://c.gamestao.com/mobile/latest/manifest.json)
          acao=$(echo "$headers" | grep -i '^access-control-allow-origin:' || true)
          echo "${acao:-no Access-Control-Allow-Origin header}"
          if ! echo "$acao" | grep -qF '*'; then
            echo "::error::the hot-update manifest is served without Access-Control-Allow-Origin."
            echo "Shipped iOS/Android builds fetch it cross-origin from the Capacitor WebView and"
            echo "will fail with a CORS error, not a status code -- the app just silently stops"
            echo "updating. Check that cf-root/_headers was staged and that the deploy uploaded it."
            exit 1
          fi
