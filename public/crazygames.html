<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!--
      CrazyGames SDK v3 — must be loaded BEFORE the game bundle.
      The SDK attaches itself to window.CrazyGames.
      https://docs.crazygames.com/sdk/html5/
    -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <title>Game</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: #000;
      }
      canvas { display: block; }

      /*
        Optional: banner ad container.
        Uncomment and size to match your banner slot.
        Give the div an id that matches what you pass to crazyGames.requestBanner().

        #cg-banner {
          position: fixed;
          bottom: 0;
          left: 50%;
          transform: translateX(-50%);
          width: 728px;
          height: 90px;
          z-index: 100;
        }
      */
    </style>
  </head>
  <body>
    <!--
      Uncomment if you want a banner slot:
      <div id="cg-banner"></div>
    -->
  </body>
</html>
