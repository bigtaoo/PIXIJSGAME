  <text x="424" y="333" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" fill="#EEE4C0" stroke="#7A5030" stroke-width="0.9" paint-order="stroke" style="fill:rgb(238, 228, 192);stroke:rgb(122, 80, 48);color:rgb(0, 0, 0);stroke-width:0.9px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, sans-serif;font-size:23px;font-weight:400;text-anchor:middle;dominant-baseline:auto">★</text>

